name: request

# Responds to new issues: if the title or body contains a repository URL, the
# repository is evaluated with neosloc, the report is stored (and added to
# targets.txt for weekly re-evaluation), and the issue gets the summary as a
# reply and is closed. Issues without a URL are left alone.
#
# Guard rails, since anyone can open an issue: GitHub repositories over
# MAX_MB wait for a maintainer to add the `approved` label; the URL must match
# a strict pattern; the issue text reaches the scripts only through env vars.

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: archive-data
  cancel-in-progress: false

env:
  MAX_MB: "500"

jobs:
  evaluate:
    if: github.event.action == 'opened' || github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      evaluated: ${{ steps.eval.outputs.evaluated }}
    steps:
      - name: Find a repository URL in the issue
        id: url
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          text = os.environ.get("TITLE", "") + "\n" + os.environ.get("BODY", "")
          m = re.search(r"https://(?:github\.com|gitlab\.com|codeberg\.org|bitbucket\.org)/[\w.-]+/[\w.-]+", text)
          print("url=" + (m.group(0).rstrip(".") if m else ""))
          PY
      - uses: actions/checkout@v7
        if: steps.url.outputs.url != ''
      - uses: actions/setup-python@v6
        if: steps.url.outputs.url != ''
        with:
          python-version: "3.12"
      - if: steps.url.outputs.url != ''
        run: pip install -r requirements.txt
      - name: Add and evaluate
        id: eval
        if: steps.url.outputs.url != ''
        env:
          URL: ${{ steps.url.outputs.url }}
          APPROVED: ${{ github.event.label.name == 'approved' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          limit="$MAX_MB"; if [ "$APPROVED" = "true" ]; then limit=0; fi
          set +e
          slug=$(python archive.py add "$URL" --max-mb "$limit"); status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then exit 0; fi
          python archive.py evaluate --only "$URL"
          echo "evaluated=$slug" >> "$GITHUB_OUTPUT"
      - name: Store the report
        if: steps.eval.outputs.evaluated != ''
        env:
          SLUG: ${{ steps.eval.outputs.evaluated }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name "neosloc-archive[bot]"
          git config user.email "neosloc-archive@users.noreply.github.com"
          git add targets.txt data static/reports content/repos
          git diff --cached --quiet || git commit -m "Evaluate $SLUG (#$ISSUE)"
          git pull --rebase --quiet origin main
          git push
      - name: Reply
        if: steps.url.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.eval.outputs.evaluated }}
          STATUS: ${{ steps.eval.outputs.status }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ -n "$SLUG" ]; then
            python archive.py summary "$SLUG" > reply.md
            printf '\n\nThe page will be live in a few minutes. The repository is now re-evaluated weekly.\n' >> reply.md
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file reply.md
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
          elif [ "$STATUS" = "4" ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label needs-approval
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "This repository is over ${MAX_MB} MB, so it waits for a maintainer to add the \`approved\` label before it's evaluated."
          else
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "I couldn't evaluate that URL: it must be a reachable public repository such as https://github.com/OWNER/REPO."
          fi

  site:
    needs: evaluate
    if: needs.evaluate.outputs.evaluated != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
