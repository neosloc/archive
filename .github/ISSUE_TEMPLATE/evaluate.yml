name: Evaluate a repository
description: Add a public repository to the neosloc archive.
title: "Evaluate: "
labels: [evaluate]
body:
  - type: markdown
    attributes:
      value: |
        The repository is cloned and analysed with [neosloc](https://neosloc.github.io/neosloc/); its code is
        only read, never executed. The evaluation starts as soon as the issue is created, and the summary is posted
        here. Repositories over 500 MB wait for a maintainer's approval.
        Any issue that contains a repository URL works too; this form just makes it easy.
  - type: input
    id: url
    attributes:
      label: Repository URL
      description: "https://github.com/OWNER/REPO (GitHub, GitLab, Codeberg or Bitbucket)"
      placeholder: https://github.com/OWNER/REPO
    validations:
      required: true
